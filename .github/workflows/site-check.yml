name: Site check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated pages are up to date
        run: python3 src/build.py --check
      - name: No broken local links
        run: python3 scripts/check_links.py
      - name: Scripts parse
        run: |
          for f in assets/js/*.js; do node --check "$f"; done
