  <link rel="stylesheet" href="{P}assets/css/tools.css">
  <section class="stage-dark" id="checker-stage" style="padding-top:0">
    <div class="wrap">
      <div class="tool-hero">
        <h1>Which UAE climate rules apply to you?</h1>
        <p class="lede">Eight questions. Your answers stay in your browser.</p>
      </div>
      <div class="wizard">
        <div style="min-width:0">
          <div class="necklace" id="necklace" aria-label="Progress"></div>
          <div class="qcard" id="qcard"></div>
        </div>
        <aside class="compass-card" aria-label="Your obligations map">
          <div class="compass-head"><h3>Your obligations map</h3><span class="count" id="compass-count"></span></div>
          <svg class="compass" id="compass" viewBox="-56 -6 532 432" role="group" aria-label="Obligations by status"></svg>
          <div class="legend"><span class="pill applies">Applies</span><span class="pill likely">Likely</span><span class="pill check">Check</span><span class="pill none">Not indicated</span></div>
          <p class="compass-note">Select a point to read about it.</p>
        </aside>
      </div>
    </div>
  </section>

  <section id="results" style="padding-top:clamp(48px,6vw,80px)">
    <div class="wrap">
      <div class="section-head" style="margin-bottom:28px">
        <h2>Your obligations</h2>
      </div>
      <div class="results-grid">
        <div class="ob-list" id="ob-list" aria-live="polite"></div>
        <div class="side-stack" id="side-stack"></div>
      </div>
    </div>
  </section>
  <script src="{P}assets/js/obligations.js" defer></script>
